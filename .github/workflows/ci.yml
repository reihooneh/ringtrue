name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs can read the code and nothing else unless they say so.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: C++ and WebAssembly tools
        run: sudo apt-get update && sudo apt-get install -y clang lld clang-tidy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned packages and test browser
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Static analysis (clang-tidy, warnings are errors)
        run: make lint
      - name: Core tests under AddressSanitizer and UBSan
        run: make test-core
      - name: Build the WebAssembly module and the command line tool
        run: make wasm cli
      - name: Check the committed site matches its sources
        run: |
          npm run build
          git diff --exit-code -- site
      - name: Node and browser tests
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the WebAssembly module
        run: sudo apt-get update && sudo apt-get install -y clang lld && make wasm
      - uses: actions/configure-pages@v5
      - name: Publish only the built site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
